name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned app
        run: >-
          xcodebuild archive
          -project AgentIOS.xcodeproj
          -scheme AgentIOS
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/AgentIOS.xcarchive
          CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA for signing in 全能签
        run: |
          mkdir -p build/Payload
          cp -R build/AgentIOS.xcarchive/Products/Applications/AgentIOS.app build/Payload/
          cd build
          /usr/bin/zip -qry AgentIOS-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentIOS-unsigned-ipa
          path: build/AgentIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
